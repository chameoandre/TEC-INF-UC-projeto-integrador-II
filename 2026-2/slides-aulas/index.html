<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides Interativos das Aulas • Projeto Integrador II (IFSC Garopaba)</title>
  <meta name="description" content="Slides pedagógicos interativos para as aulas de Projeto Integrador II: Objetivos, Metodologia, Trabalhos Relacionados, Experimentos Científicos e Expressão de Resultados.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root, [data-theme="dark"] {
      --bg-dark: #070d09;
      --bg-surface: #0e1711;
      --bg-card: rgba(16, 27, 20, 0.85);
      --bg-card-hover: rgba(23, 38, 28, 0.95);
      --border-color: rgba(34, 197, 94, 0.22);
      --border-glow: rgba(34, 197, 94, 0.45);

      --ifsc-green: #16a34a;
      --ifsc-green-light: #4ade80;
      --ifsc-green-glow: rgba(34, 197, 94, 0.3);
      --ifsc-red: #ef4444;

      --accent-cyan: #06b6d4;
      --accent-cyan-light: #67e8f9;
      --accent-amber: #f59e0b;
      --accent-amber-light: #fde68a;
      --accent-purple: #a855f7;
      --accent-purple-light: #d8b4fe;
      --accent-blue: #3b82f6;
      --accent-blue-light: #93c5fd;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-dark: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-card-hover: #ffffff;
      --border-color: rgba(22, 163, 74, 0.25);
      --border-glow: rgba(22, 163, 74, 0.5);

      --ifsc-green: #15803d;
      --ifsc-green-light: #16a34a;
      --ifsc-green-glow: rgba(22, 163, 74, 0.2);
      --ifsc-red: #dc2626;

      --accent-cyan: #0284c7;
      --accent-cyan-light: #38bdf8;
      --accent-amber: #d97706;
      --accent-amber-light: #f59e0b;
      --accent-purple: #7e22ce;
      --accent-purple-light: #a855f7;
      --accent-blue: #2563eb;
      --accent-blue-light: #3b82f6;

      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;

      --shadow-glass: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      user-select: none;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
    }

    /* Top Navigation Header */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0.65rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      z-index: 100;
      backdrop-filter: blur(14px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--ifsc-green) 0%, #059669 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 1.15rem;
      box-shadow: 0 4px 12px var(--ifsc-green-glow);
    }

    .brand-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-title p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Lesson Navigation Pills */
    .lesson-nav-bar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.3rem 0.4rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .lesson-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .lesson-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
    }

    .lesson-tab.active {
      background: var(--ifsc-green);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--ifsc-green-glow);
    }
    .lesson-tab.active.cyan { background: #0284c7; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35); }
    .lesson-tab.active.purple { background: #7c3aed; box-shadow: 0 2px 8px rgba(124, 58, 237, 0.35); }
    .lesson-tab.active.green { background: #16a34a; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.35); }
    .lesson-tab.active.blue { background: #2563eb; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35); }
    .lesson-tab.active.amber { background: #d97706; box-shadow: 0 2px 8px rgba(217, 119, 6, 0.35); }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.75rem;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-header:hover {
      background: var(--chip-bg);
      border-color: var(--ifsc-green-light);
      color: var(--ifsc-green-light);
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--ifsc-green) 0%, var(--accent-cyan) 100%);
      width: 20%;
      transition: width 0.3s ease;
    }

    /* Slide Viewport */
    .deck-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .slide-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 2.2rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.97) translateY(18px);
      transition: opacity 0.38s ease, transform 0.38s ease, visibility 0.38s;
      overflow-y: auto;
    }

    .slide-wrapper.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }

    /* Slide Elements */
    .slide-header {
      margin-bottom: 1.5rem;
      max-width: 950px;
    }

    .slide-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.22rem 0.7rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
      border: 1px solid currentColor;
    }
    .slide-tag.amber { color: var(--accent-amber-light); background: rgba(245, 158, 11, 0.14); }
    .slide-tag.cyan { color: var(--accent-cyan-light); background: rgba(6, 182, 212, 0.14); }
    .slide-tag.purple { color: var(--accent-purple-light); background: rgba(168, 85, 247, 0.14); }
    .slide-tag.green { color: var(--ifsc-green-light); background: rgba(34, 197, 94, 0.14); }
    .slide-tag.blue { color: var(--accent-blue-light); background: rgba(59, 130, 246, 0.14); }

    .slide-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .slide-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Grids & Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.4rem;
      box-shadow: var(--shadow-glass);
      backdrop-filter: blur(10px);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .card-box:hover {
      border-color: var(--border-glow);
      transform: translateY(-2px);
    }

    .card-box h3, .card-box h4 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-box p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Visual Cliparts and Diagrams */
    .clipart-hero-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    .clipart-hero-box svg {
      width: 100%;
      max-height: 110px;
    }

    /* Comparison Box (Wrong vs Correct) */
    .compare-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 0.5rem;
    }

    .compare-side {
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid;
    }

    .compare-side.wrong {
      background: rgba(239, 68, 68, 0.06);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .compare-side.correct {
      background: rgba(34, 197, 94, 0.06);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .compare-title {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .compare-side.wrong .compare-title { color: #f87171; }
    .compare-side.correct .compare-title { color: #4ade80; }

    .compare-side ul {
      padding-left: 1.2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Highlight Banner */
    .highlight-banner {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(6, 182, 212, 0.12) 100%);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 12px;
      padding: 1.1rem 1.4rem;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .highlight-icon {
      font-size: 1.6rem;
      color: var(--ifsc-green-light);
      flex-shrink: 0;
    }

    .highlight-text {
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Bottom Controls */
    footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 0.6rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .slide-dots {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: var(--transition);
    }

    .dot.active {
      width: 22px;
      border-radius: 10px;
      background: var(--ifsc-green);
    }

    .footer-center {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--ifsc-green);
      color: #ffffff;
      border-color: var(--ifsc-green);
      transform: scale(1.05);
    }

    .btn-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    .kbd-shortcut {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .grid-2, .grid-3, .grid-4, .compare-container {
        grid-template-columns: 1fr;
      }
      .slide-wrapper {
        padding: 1.5rem 1.5rem;
      }
      .slide-title {
        font-size: 1.6rem;
      }
      header {
        padding: 0.5rem 1rem;
      }
    }
  </style>
</head>

          {

                  <h3><i class="fa-solid fa-chart-column text-blue"></i> Matriz de Gráficos</h3>
                  <p>Barras para comparar grupos discretos; Linhas para evolução temporal contínua; Boxplot para dispersão e quartis; Dispersão para correlação.</p>
                </div>
                <div class="card-box">
                  <h3><i class="fa-solid fa-table text-cyan"></i> Tabelas SBC (booktabs)</h3>
                  <p>Regra absoluta da SBC e ABNT: <strong>NUNCA use linhas verticais em tabelas científicas</strong>. Use apenas <code>\\toprule</code>, <code>\\midrule</code> e <code>\\bottomrule</code>.</p>

                <div class="card-box">
                  <h3><i class="fa-solid fa-comment-dots text-green"></i> Análise Crítica</h3>
                  <p>Não basta colar o gráfico e dizer "veja a figura". Explique o que a média e o desvio padrão representam em relação à hipótese original.</p>
                </div>
              </div>
            `
          },
          {
            tag: 'Matriz de Decisão • Aula 5',
            titulo: 'Qual Gráfico Escolher para o seu Artigo?',
            subtitulo: 'Regras visuais para selecionar a representação gráfica mais eficiente para seus dados:',
            html: `
              <div class="grid-4">
                <div class="card-box">
                  <h4 style="color: #60a5fa;"><i class="fa-solid fa-chart-bar"></i> Gráfico de Barras</h4>
                  <strong style="font-size: 0.8rem; color: var(--text-main);">Quando usar:</strong>
                  <p style="margin-top: 0.3rem;">Comparar grandezas entre categorias distintas (ex.: novatos vs veteranos; tempo por tarefa).</p>
                </div>
                <div class="card-box">
                  <h4 style="color: #38bdf8;"><i class="fa-solid fa-chart-line"></i> Gráfico de Linhas</h4>
                  <strong style="font-size: 0.8rem; color: var(--text-main);">Quando usar:</strong>
                  <p style="margin-top: 0.3rem;">Séries temporais e evolução contínua (ex.: variação de temperatura ao longo de 48h; oscilação de bitrate).</p>

                <div class="card-box">
                  <h4 style="color: #c084fc;"><i class="fa-solid fa-braille"></i> Dispersão (Scatter)</h4>
                  <strong style="font-size: 0.8rem; color: var(--text-main);">Quando usar:</strong>
                  <p style="margin-top: 0.3rem;">Analisar a correlação entre duas variáveis contínuas (ex.: tamanho do modelo 3D vs tempo de processamento).</p>
                </div>
                <div class="card-box">
                  <h4 style="color: #4ade80;"><i class="fa-solid fa-boxes-stacked"></i> Boxplot</h4>
                  <strong style="font-size: 0.8rem; color: var(--text-main);">Quando usar:</strong>
                  <p style="margin-top: 0.3rem;">Demonstrar a distribuição estatística completa: mediana, quartis e outliers (ex.: latência de rede em 1000 pings).</p>
                </div>
              </div>
            `
          }
        ]
      },

      // ==========================================
      // COTB 2027: GUIA DE SUBMISSÃO
      // ==========================================
      'cotb': {
        nome: 'COTB 2027 • Guia de Submissão',
        tagCor: 'amber',
        slides: [
          {
            tag: 'Evento Alvo • 15/11',
            titulo: 'Computer on the Beach 2027: O Destino dos Artigos',
            subtitulo: '18ª edição do principal congresso de computação aplicada do Sul do Brasil, sediado em Florianópolis.',
            html: `
              <div class="clipart-hero-box">
                <svg viewBox="0 0 280 85" fill="none">
                  <circle cx="75" cy="40" r="22" fill="#fbbf24" opacity="0.9" />

                  <p>A submissão é realizada eletronicamente através do sistema <a href="https://jems3.sbc.org.br/events" target="_blank" style="color: #86efac; font-weight: 700; text-decoration: underline;">JEMS3 da SBC</a> até o dia 15 de novembro de 2026.</p>

    };

    // Estado da Apresentação
    let aulaAtual = '1';
    let slideIndexAtual = 0;

    // Inicialização
    function init() {
      // Lê parâmetro da URL (ex: ?aula=2)
      const params = new URLSearchParams(window.location.search);
      const paramAula = params.get('aula') || '1';
      if (AULAS_DATA[paramAula]) {
        aulaAtual = paramAula;
      }
      renderizarNavegacaoAulas();
      carregarAula(aulaAtual, 0);
      configurarTeclado();
    }

    // Renderiza as abas de aula no topo
    function renderizarNavegacaoAulas() {
      const tabs = document.querySelectorAll('.lesson-tab');
      tabs.forEach(tab => {
        tab.classList.remove('active');
        const onclickAttr = tab.getAttribute('onclick');
        if (onclickAttr && onclickAttr.includes(`'${aulaAtual}'`)) {
          tab.classList.add('active');
        }
      });
    }

    // Muda a aula ativa
    function mudarAula(novaAula) {
      if (!AULAS_DATA[novaAula]) return;
      aulaAtual = novaAula;
      slideIndexAtual = 0;
      
      // Atualiza URL sem recarregar
      const url = new URL(window.location);
      url.searchParams.set('aula', novaAula);
      window.history.replaceState({}, '', url);

      renderizarNavegacaoAulas();
      carregarAula(aulaAtual, 0);
    }

    // Carrega e desenha os slides da aula
    function carregarAula(idAula, indiceSlide) {
      const aula = AULAS_DATA[idAula];
      if (!aula) return;

      const container = document.getElementById('deckContainer');
      container.innerHTML = '';

      aula.slides.forEach((s, idx) => {
        const slideEl = document.createElement('section');
        slideEl.className = 'slide-wrapper' + (idx === indiceSlide ? ' active' : '');
        slideEl.id = `slide-${idx}`;
        slideEl.innerHTML = `
          <div class="slide-header">
            <span class="slide-tag ${aula.tagCor}">${s.tag}</span>
            <h2 class="slide-title">${s.titulo}</h2>
            <p class="slide-subtitle">${s.subtitulo}</p>
          </div>
          <div class="slide-body">
            ${s.html}
          </div>
        `;
        container.appendChild(slideEl);
      });

      slideIndexAtual = indiceSlide;
      atualizarControlesRodape();
    }

    // Atualiza barra de progresso, contador e botões
    function atualizarControlesRodape() {
      const total = AULAS_DATA[aulaAtual].slides.length;
      
      // Contador
      document.getElementById('slideCounter').innerText = `Slide ${slideIndexAtual + 1} de ${total}`;

      // Barra de Progresso
      const pct = ((slideIndexAtual + 1) / total) * 100;
      document.getElementById('progressBar').style.width = `${pct}%`;

      // Botões Prev / Next
      document.getElementById('btnPrev').disabled = (slideIndexAtual === 0);
      document.getElementById('btnNext').disabled = (slideIndexAtual === total - 1);

      // Dots
      const dotsContainer = document.getElementById('slideDots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === slideIndexAtual ? ' active' : '');
        dot.onclick = () => irParaSlide(i);
        dotsContainer.appendChild(dot);
      }
    }

    // Navegação de slides
    function proximoSlide() {
      const total = AULAS_DATA[aulaAtual].slides.length;
      if (slideIndexAtual < total - 1) {
        irParaSlide(slideIndexAtual + 1);
      }
    }

    function slideAnterior() {
      if (slideIndexAtual > 0) {
        irParaSlide(slideIndexAtual - 1);
      }
    }

    function irParaSlide(novoIndex) {
      const slides = document.querySelectorAll('.slide-wrapper');
      slides.forEach((s, idx) => {
        if (idx === novoIndex) {
          s.classList.add('active');
        } else {
          s.classList.remove('active');
        }
      });
      slideIndexAtual = novoIndex;
      atualizarControlesRodape();
    }

    // Configuração de Teclado
    function configurarTeclado() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          proximoSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          slideAnterior();
        } else if (e.key === 'Home') {
          e.preventDefault();
          irParaSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          irParaSlide(AULAS_DATA[aulaAtual].slides.length - 1);
        } else if (e.key.toLowerCase() === 'f') {
          alternarTelaCheia();
        } else if (e.key === 'Escape') {
          if (!document.fullscreenElement) {
            window.location.href = '../index.html';
          }
        }
      });
    }

    // Fullscreen API
    function alternarTelaCheia() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Erro ao ativar tela cheia:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Executa ao carregar
    window.onload = init;
  </script>
